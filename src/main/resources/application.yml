# Application YAML Configuration (src/main/resources/application.yml)

# Server configuration
server:
  port: 8080
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# Logging configuration
logging:
  level:
    root: INFO
    me.gaga: DEBUG
  pattern:
    file: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'
  file:
    name: logs/application.log

# Vaadin configuration
vaadin:
  launch-browser: true
  productionMode: false

# Spring configuration
spring:
  application:
    name: spring-react-vaadin

  # AI/Ollama configuration with environment variable support
  ai:
    ollama:
      base-url: http://${OLLAMA_HOST:localhost}:${OLLAMA_PORT:11434}
      chat:
        model: ${OLLAMA_MODEL:mistral}
        options:
          temperature: 0.7
          top-p: 0.9

  # Database configuration
  datasource:
    url: jdbc:h2:mem:products-db
    driverClassName: org.h2.Driver
    username: sa
    password: password

  # H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA/Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

# Actuator for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

---
# Production profile configuration
spring:
  config:
    activate:
      on-profile: production

#vaadin:
  #productionMode: true
  #launch-browser: false

logging:
  level:
    root: WARN
    me.gaga: INFO
