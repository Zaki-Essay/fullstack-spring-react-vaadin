# Server configuration
server:
  port: 8080
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# Logging configuration
logging:
  level:
    root: INFO
    me.gaga: DEBUG
  pattern:
    file: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'
  file:
    name: logs/application.log

# Vaadin configuration
vaadin:
  launch-browser: true
  productionMode: false

# Spring configuration
spring:
  application:
    name: spring-react-vaadin

  # AI/Ollama configuration with environment variable support
  ai:
    ollama:
      base-url: http://${OLLAMA_HOST:localhost}:${OLLAMA_PORT:11434}
      chat:
        model: ${OLLAMA_MODEL:mistral}
        options:
          temperature: 0.7
          top-p: 0.9
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
        options:
          temperature: 0.1
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768  # Changed from 1536 to 768 for nomic-embed-text
        remove-existing-vector-store-table: true  # Set to true to recreate table with correct dimensions

  # Database configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10

  # JPA/Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

# Application specific configuration
app:
  upload:
    dir: uploads

# Actuator for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

---
# Development profile configuration
spring:
  config:
    activate:
      on-profile: dev

#vaadin:
  #productionMode: true
  #launch-browser: false
app:
  upload:
    dir: uploads

logging:
  level:
    root: WARN
    me.gaga: INFO