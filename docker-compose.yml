version: '3.8'

services:
  # Your Spring Boot application
  spring-react-vaadin:
    image: zikossy/spring-react-vaadin:dev-0cb6ac1
    container_name: spring-react-vaadin-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
      - OLLAMA_MODEL=mistral
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    depends_on:
      - ollama
    networks:
      - app-network
    restart: unless-stopped

  # Ollama service
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-service
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - app-network
    restart: unless-stopped
    # Start Ollama and pull model
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve &
       pid=$!
       sleep 10
       ollama pull mistral
       wait $pid"

volumes:
  ollama-data:
    driver: local

networks:
  app-network:
    driver: bridge